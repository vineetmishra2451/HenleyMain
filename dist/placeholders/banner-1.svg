<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" width="1440" height="480">
    <defs>
        <style>
            .bg { fill: #F5F3EF; }
            .hairline { stroke: #E5DFD6; stroke-width: 2; fill: none; }
            .gold-arch { stroke: #B08B4F; stroke-width: 1.5; fill: none; opacity: 0.45; }
            .gold-fill { fill: #B08B4F; opacity: 0.12; }
            .brand { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; font-weight: 500; fill: #231C18; letter-spacing: 0.25em; text-anchor: middle; }
            .meta { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #6E635B; letter-spacing: 0.16em; text-transform: uppercase; text-anchor: middle; }
            .sub { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #8E8278; letter-spacing: 0.08em; text-anchor: middle; }
        </style>
    </defs>
    <!-- Background Canvas -->
    <rect width="1440" height="480" class="bg" />
    <!-- 1px Inset Hairline Border -->
    <rect x="8" y="8" width="1424" height="464" class="hairline" rx="8" />

    <!-- Centered Apothecary Arch Motif -->
    <g transform="translate(667.2, 166.08)">
        <!-- Arch Niche -->
        <path d="M 0,105.6 L 0,47.52 A 52.8,52.8 0 0,1 105.6,47.52 L 105.6,105.6 Z" class="gold-fill" />
        <path d="M 0,105.6 L 0,47.52 A 52.8,52.8 0 0,1 105.6,47.52 L 105.6,105.6 Z" class="gold-arch" />
        <!-- Cloche Handle Top Notch -->
        <circle cx="52.8" cy="-11.28" r="4" stroke="#B08B4F" stroke-width="1.5" fill="none" opacity="0.45" />
    </g>

    <!-- Typography Block -->
    <text x="720" y="287.52" class="brand">HENLEY</text>
    <text x="720" y="317.52" class="meta">Promotional Banner</text>
    <text x="720" y="339.52" class="sub">1440 × 480px • 3:1</text>
</svg>